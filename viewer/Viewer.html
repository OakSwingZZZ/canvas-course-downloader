<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Canvas Viewer</title>

    <!-- React Scripts DOM & React -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <!-- Babel (Converting JSX / React to JS in browser)-->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- JS Zip (For unzipping)-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <!-- JS Mammoth (For rendering .docx files)-->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <!-- JS Chart.js (For rendering Powerpoint files)-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/pptxjs@1.1.9/dist/PptxViewJS.min.js"></script>

    <!-- External CSS Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=settings"
    />

    <!-- IndexedDB Key Value Store -->
    <script src="https://cdn.jsdelivr.net/npm/idb-keyval@3/dist/idb-keyval-iife.min.js"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="./style/style.css" />
  </head>
  <body>
    <!-- React Components (Must use type="text/babel") -->
    <script type="text/babel" src="./contexts/CourseContext.jsx"></script>
    <script type="text/babel" src="./contexts/NavigationContext.jsx"></script>

    <!-- Pages-->
    <script type="text/babel" src="./pages/AnnouncementDetailPage.jsx"></script>
    <script type="text/babel" src="./pages/AnnouncementsPage.jsx"></script>
    <script type="text/babel" src="./pages/App.jsx"></script>
    <script type="text/babel" src="./pages/AssignmentsPage.jsx"></script>
    <script type="text/babel" src="./pages/AssignmentDetailView.jsx"></script>
    <script type="text/babel" src="./pages/DiscussionsPage.jsx"></script>
    <script type="text/babel" src="./pages/DiscussionDetailView.jsx"></script>
    <script type="text/babel" src="./pages/FilesPage.jsx"></script>
    <script type="text/babel" src="./pages/FilesPageDetailView.jsx"></script>
    <script type="text/babel" src="./pages/GradesPage.jsx"></script>
    <script type="text/babel" src="./pages/HomePage.jsx"></script>
    <script type="text/babel" src="./pages/MainContent.jsx"></script>
    <script type="text/babel" src="./pages/ModulesPage.jsx"></script>
    <script type="text/babel" src="./pages/NameProfileCard.jsx"></script>
    <script type="text/babel" src="./pages/PagesPage.jsx"></script>
    <script type="text/babel" src="./pages/PageDetailView.jsx"></script>

    <!-- Components -->
    <script type="text/babel" src="./components/AssignmentRubric.jsx"></script>
    <script type="text/babel" src="./components/CanvasItemIcon.jsx"></script>
    <script type="text/babel" src="./components/CanvasSubmission.jsx"></script>
    <script type="text/babel" src="./components/ContextPill.jsx"></script>
    <script type="text/babel" src="./components/CollapseTable.jsx"></script>
    <script type="text/babel" src="./components/CoursePicker.jsx"></script>
    <script type="text/babel" src="./components/CourseList.jsx"></script>
    <script type="text/babel" src="./components/DocxMemoryViewer.jsx"></script>
    <script type="text/babel" src="./components/LocalAtatchmentViewer.jsx"></script>
    <script type="text/babel" src="./components/PptxMemoryViewer.jsx"></script>
    <script type="text/babel" src="./components/ScoreDistributionGraph.jsx"></script>
    <script type="text/babel" src="./components/TopBreadcrumbs.jsx"></script>

    <!-- Helpers -->
    <script type="text/babel" src="./helpers/Helpers.jsx"></script>

    <!-- The container where React renders -->
    <div id="root" style="display: flex; width: 100%"></div>
  </body>
</html>
